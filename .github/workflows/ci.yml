name: CI

on:
  push:
    branches: [master, opensource, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: 源码检查 (Windows / Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装固定依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法编译（所有包）
        run: python -m compileall -q collector core shared store notifications channels web scripts livedeck

      - name: 运行公开快照离线测试
        run: python -m unittest discover -s .github/tests -v

      - name: 运行开发线全量单元测试
        if: hashFiles('tests/test_*.py') != ''
        run: python scripts/run_tests.py -v

      - name: 发布前检查（关键文件 / 凭据扫描 / 脚本编码）
        run: python scripts/release.py check

  runtime-package:
    name: 自带运行时 + 绿色包冒烟 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 构建 runtime/（下载 embeddable + 预装依赖）
        run: python scripts/build_runtime.py

      - name: 校验 runtime/（缺 python312.zip、_pth 没配好都会报）
        run: python scripts/build_runtime.py --check

      - name: 发布前检查（关键文件 / 凭据扫描 / 脚本编码）
        run: python scripts/release.py check

      - name: 打绿色包
        run: python scripts/release.py build

      - name: 解压后只用自带运行时跑一遍（解压即用）
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Write-Host "包：$($zip.Name)，$([math]::Round($zip.Length / 1MB, 1)) MB"
          Expand-Archive -Path $zip.FullName -DestinationPath pkg -Force
          Set-Location (Get-ChildItem pkg -Directory | Select-Object -First 1).FullName

          & ./runtime/python.exe scripts/preflight.py
          if ($LASTEXITCODE -ne 0) { throw "preflight 有阻塞项（退出码 $LASTEXITCODE）" }

          # 空名单让机器人跑完一轮启动、读写库和退出，整个过程无需连接 B 站。
          Set-Content -LiteralPath config/ci-subjects.json -Value '{"subjects":[]}' -Encoding utf8NoBOM
          & ./runtime/python.exe scripts/run_bot.py --subjects config/ci-subjects.json --poll-mode per_user --once --channel echo --no-cards --db ci-smoke.db
          if ($LASTEXITCODE -ne 0) { throw "run_bot 冒烟失败（退出码 $LASTEXITCODE）" }
          if (-not (Test-Path -LiteralPath ci-smoke.db -PathType Leaf)) { throw "run_bot 冒烟未创建数据库" }

  lint-frontend:
    name: 内联 JS 语法（web/index.html）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抽出 <script> 并做语法检查
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          body = "\n;\n".join(s for s in scripts if s.strip())
          pathlib.Path("/tmp/index_check.js").write_text(body, encoding="utf-8")
          print(f"extracted {len(body)} chars from {len(scripts)} blocks")
          PY
          node --check /tmp/index_check.js

  docs-links:
    name: 文档内链检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 Markdown 里的相对链接是否存在
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts or "node_modules" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8", errors="ignore")
              for target in re.findall(r"\]\((?!https?://|mailto:|#)([^)\s]+)\)", text):
                  target = target.split("#")[0]
                  if not target:
                      continue
                  p = (md.parent / target).resolve()
                  if not p.exists():
                      bad.append(f"{md}: {target}")
          for line in bad:
              print("MISSING", line)
          print(f"{len(bad)} missing link(s)")
          sys.exit(1 if bad else 0)
          PY
